version: "3.9"

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    container_name: catalogue
    ports:
      [8080:8080]
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: catalogue-db
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: catalogue_db      
    ports:
      [3306:3306]
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:    